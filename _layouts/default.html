<!doctype html>
<html lang="{{ site.lang | default: 'ko' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% if site.preview or page.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  {% feed_meta %}
</head>
<body data-hit-api="{{ site.data.research_hits.endpoint | escape }}">
  {% if site.preview %}
  <div class="preview-banner" role="note"><div class="container"><strong>LOCAL PREVIEW</strong><span>검토용 미리보기 · 아직 공개 사이트에 반영되지 않았습니다.</span></div></div>
  {% endif %}
  {% include header.html %}
  <main class="container">
    {{ content }}
  </main>
  {% unless page.research_methods %}{% include footer.html %}{% endunless %}
  <script type="application/json" id="site-updates">{"items":{{ site.data.item_updates | jsonify }},"nav":{{ site.data.nav_changes | jsonify }}}</script>
  <script src="{{ '/assets/js/orbit.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  <script src="{{ '/assets/js/nav.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  <script src="{{ '/assets/js/research-map-hits.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
