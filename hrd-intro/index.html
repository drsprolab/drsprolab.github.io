<style>
#pw-gate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px;background:var(--paper,#fff)}
#pw-gate form{width:min(100%,380px);display:grid;gap:12px}

#pw-gate input:focus{outline:2px solid var(--accent);outline-offset:1px}
#pw-gate button{font:inherit;font-weight:600;font-size:15px;padding:11px 14px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
#pw-msg{color:var(--danger);font-size:14px;min-height:1.2em}
.mat-empty{padding:28px 4px;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0}

<script>
/* 자료 목록: 새 자료는 materials/ 폴더에 PDF를 넣고 여기에 한 줄 추가한다. */
var MATERIALS = [
  // { title: '제목', sub: '핵심 키워드', file: 'materials/hrd-note-01.pdf', pages: 20, mb: 3.1 },
  { title: 'HRD의 역사와 기본 개념', sub: 'Nadler에서 Bierema까지 · 8인의 학자로 읽는 HRD 패러다임', file: 'materials/hrd-note-01.pdf', pages: 28, mb: 4.7 },
  { title: '인간학습과 학습설계', sub: '학습이론 · 교수설계', file: 'materials/hrd-note-02.pdf', pages: 23, mb: 7.4 },
  { title: '경력개발의 개념과 설계 전략', sub: '개인의 성장 · 조직의 목표 · AI', file: 'materials/hrd-note-03.pdf', pages: 38, mb: 1.5 },
  { title: '조직개발', sub: '레윈 3단계 · 행동연구 · 강점탐구 4D · 인터벤션', file: 'materials/hrd-note-04.pdf', pages: 20, mb: 4.5 },
  { title: 'HRD 요구분석', sub: '자료수집 · 설문 설계 · IPA · Borich 요구도 · Locus for Focus', file: 'materials/hrd-note-05.pdf', pages: 14, mb: 3.1 },
  { title: '교육 프로그램 개발과 성과 관리', sub: 'ADDIE · Kirkpatrick 4수준 · KPI와 OKR', file: 'materials/hrd-note-06.pdf', pages: 35, mb: 1.6 },
  { title: 'AI 역설적 현상', sub: '학습≠성과 · 생산성·동기·문화의 역설 · 브레인 캐피탈 · AX와 AI agent 설계', file: 'materials/hrd-note-07.pdf', pages: 14, mb: 2.7 },
  { title: 'AI 역설 발표자료', sub: 'AI Paradox: 아이들의 미래는 안전한가? · 신기루에 빠진 학교 · 브레인 캐피탈 · 교사의 역할', file: 'materials/hrd-note-08.pdf', pages: 25, mb: 7.6 },
];

(function () {
  'use strict';
  // 목록
  var list = document.getElementById('materials');
  function fileName(i, t) { return 'HRD개론_' + String(i).padStart(2, '0') + '_' + t.replace(/\s*·\s*/g, '_').replace(/[·\s]+/g, '_') + '.pdf'; }
  MATERIALS.forEach(function (m, i) {
    var n = i + 1, li = document.createElement('li');
    li.className = 'mat-item';
    li.innerHTML = '<span class="mat-no"></span><div class="mat-body"><h3 class="mat-title"></h3><span class="mat-sub"></span><span class="mat-meta"></span></div><a class="btn btn-sm mat-dl">PDF 다운로드</a>';
    li.querySelector('.mat-no').textContent = n;
    li.querySelector('.mat-title').textContent = m.title;
    li.querySelector('.mat-sub').textContent = m.sub || '';
    li.querySelector('.mat-meta').textContent = 'PDF' + (m.pages ? ' · ' + m.pages + '쪽' : '') + (m.mb ? ' · ' + m.mb.toFixed(1) + 'MB' : '');
    var a = li.querySelector('.mat-dl'); a.href = m.file; a.setAttribute('download', fileName(n, m.title));
    list.appendChild(li);
  });
  document.getElementById('matCount').textContent = MATERIALS.length + '개 자료';
  if (!MATERIALS.length) { list.hidden = true; document.getElementById('matEmpty').hidden = false; }

})();
</script>
<script src="js/common.js?v=20261124"></script>
