# main 브랜치에 push하면 사이트를 빌드해서 GitHub Pages에 배포합니다.
name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # NEW 표시용 커밋 기록 (_plugins/item_updates.rb)
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Research Map generation and browser data
        run: |
          bundle exec ruby tests/test_research_map.rb
          bundle exec ruby tests/test_sb_diagnostics_publication.rb
          node --test tests/test_research_map_data.cjs
          node --test tests/test_ai_agent_needs.cjs
          node --test tests/test_orbit.cjs
          node --test tests/test_appointment.cjs
          node --test tests/research-help-ui.test.cjs tests/research-help-backend.test.cjs tests/research-method-selector.test.cjs
      - name: Check whether share images need regeneration
        id: og
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" != "push" ] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null || [ ! -d assets/og ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" | grep -qvE '^(assets/images/gallery/|_data/gallery\.yml$|highlights\.md$|assets/js/gallery-photo\.js$|assets/css/style\.css$|\.github/workflows/jekyll\.yml$)'; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "Gallery-only update: reuse committed share images."
          fi
      - name: Weekly Insight·Measurement 공유 이미지(Open Graph·썸네일) 만들기
        if: steps.og.outputs.required == 'true'
        run: |
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          bundle exec ruby tools/og_images.rb
      - id: pages
        uses: actions/configure-pages@v5
      - run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Verify generated Research Map and page metrics
        run: |
          python3 -m unittest discover -s tests -p 'test_research_map_*.py' -v
          python3 -m unittest discover -s tests -p 'test_insight_orbit_site.py' -v
          python3 -m unittest discover -s tests -p 'test_professor_research_site.py' -v
          python3 -m unittest discover -s tests -p 'test_menu_typography_site.py' -v
          python3 -m unittest discover -s tests -p 'test_sharing_guidance_site.py' -v
          python3 -m unittest discover -s tests -p 'test_research_methods_site.py' -v
      - uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
