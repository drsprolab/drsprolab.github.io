# GitHub Pages 주소에 맞게 수정하세요.
# - https://<아이디>.github.io 로 쓰면 baseurl: ""
# - https://<아이디>.github.io/<저장소이름> 으로 쓰면 baseurl: "/<저장소이름>"
url: "https://drsprolab.github.io"
baseurl: ""

permalink: /blog/:year/:month/:title/
markdown: kramdown
timezone: Asia/Seoul

collections:
  insights:
    output: true
    permalink: /daily-insight/:name/

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - tests
  - scripts
  - _config.preview.yml
  - LOCAL_REVIEW.md
