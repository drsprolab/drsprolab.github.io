title: PRO AnalytiX Lab
subtitle: People-Relation-Organization-AX
description: 한양대학교 교육공학과 송지훈 교수 연구실
lang: ko
locale: ko_KR
author: Ji Hoon Song
email: jhsong77@hanyang.ac.kr

# GitHub Pages 주소에 맞게 수정하세요.
# - https://<아이디>.github.io 로 쓰면 baseurl: ""
# - https://<아이디>.github.io/<저장소이름> 으로 쓰면 baseurl: "/<저장소이름>"
url: "https://hrdpro.hanyang.ac.kr"
baseurl: ""

permalink: /blog/:year/:month/:title/
markdown: kramdown
timezone: Asia/Seoul
# appointment-backend 배포 후 Google Apps Script /exec URL
appointment_script_url: "https://script.google.com/macros/s/AKfycbxrhzkohF0pUkRjmvuJdeaGKb6t__NAbWQRR_H5PI7bf85PuHudwlMEfCb4lMnKTAGk9A/exec"

collections:
  insights:
    output: true
    permalink: /weekly-insight/:name/

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - tests
  - scripts
  - tools
  - appointment-backend
  - _config.preview.yml
  - LOCAL_REVIEW.md

# 링크 공유 미리보기(Open Graph) 기본 이미지. Weekly Insight 글은 글마다 따로 만든 이미지를 쓴다(_plugins/og_image.rb).
defaults:
  - scope: { path: "", type: pages }
    values:
      image: { path: /assets/images/og-share-20261021.jpg, width: 1200, height: 630, alt: "PRO AnalytiX Lab · Hanyang University" }
  - scope: { path: "", type: posts }
    values:
      image: { path: /assets/images/og-share-20261021.jpg, width: 1200, height: 630, alt: "PRO AnalytiX Lab · Hanyang University" }
