# watch: 새 글·새 항목 추가 시 7일간 NEW 표시. 기존 내용 수정은 제외한다.
- title: Members
  url: /members/
  watch: [_data/members.yml]
  children:
    - { title: Professor-in-charge, url: /members/#professor }
    - { title: Lab Members, url: /members/#lab-members, watch: [_data/members.yml], watch_sections: [postdoc, phd, ma] }
    - { title: Alumni, url: /members/#alumni, watch: [_data/members.yml], watch_sections: [alumni_phd, alumni_ma] }
- title: Teaching & Research
  url: /research/
  always_new: true # Research Help가 상시 NEW인 동안 상위 메뉴도 표시
  watch: [research.md, research, teaching.md, _data/publications.yml, _data/presentations.yml, _data/books.yml, _data/teaching.yml]
  children:
    - { title: Research (Professor), url: /research/, watch: [_data/publications.yml, _data/books.yml], watch_scope: professor }
    - { title: Research (Lab), url: /research/lab/, watch: [research/lab.md, _data/publications.yml, _data/presentations.yml], watch_scope: lab }
    - { title: Teaching, url: /teaching/, watch: [teaching.md, _data/teaching.yml] }
    - title: Conference
      url: /conference/
      children:
        - { title: UFHRD 2026, url: /conference/ufhrd-2026/, starts_on: "2026-06-17", ends_on: "2026-06-19" }
        - { title: Asian AHRD 2026, url: /conference/asian-ahrd-2026/, starts_on: "2026-11-05", ends_on: "2026-11-08" }
        - { title: 교육공학회 - 2026-2, url: /conference/kset-2026-2/, starts_on: "2026-11-13", ends_on: "2026-11-14" }
        - { title: HRD 학회 2026-2, url: /conference/hrd-2026-2/, starts_on: "2026-11-20", ends_on: "2026-11-20" }
    - { title: PRO-AX Lab Review, url: /proax-lab-review/ }
    - { title: Appointment request, url: /appointment/ }
    - title: Research help
      url: /research-help/basics/
      always_new: true
      children:
        - { title: 논문작성법(기초), url: /research-help/basics/ }
        - { title: 연구방법선택(중급), url: /research-help/methods/ }
        - { title: 나의 연구 발전시키기(실습), url: /research-help/ }
- title: Measurement & Solution
  url: /blog/
  watch: [blog, _posts, in-progress, assets/data/academic-motivation-personas.json, assets/data/academic-motivation-sample.json, assets/data/adaptive-performance-personas.json, assets/data/adaptive-performance-sample.json, assets/data/ap-teams.json, assets/data/ee-data.json, assets/data/employee-engagement-personas.json, assets/data/employee-engagement-sample.json, assets/data/gl-profiles.json, assets/data/goal-orientation-personas.json, assets/data/goal-orientation-sample.json, assets/data/kh-data.json, assets/data/knowledge-hiding-personas.json, assets/data/knowledge-hiding-sample.json, assets/data/la-personas.json, assets/data/la-teams.json, assets/data/learning-agility-sample.json, assets/data/lm-profiles.json, assets/data/pe-data.json, assets/data/psychological-entitlement-personas.json, assets/data/psychological-entitlement-sample.json, assets/data/sc-profiles.json, assets/data/self-compassion-personas.json, assets/data/self-compassion-sample.json, assets/data/ye-personas.json, assets/data/youth-entrepreneurship-sample.json]
  children:
    - { title: Measurement & Solution, url: /blog/, watch: [_posts] }
    - { title: In progress 진단, url: /in-progress/, watch: [in-progress], badge: BETA test }
- title: Project
  url: /project/
  watch: [project.md, _data/projects.yml, _data/lectures.yml, _data/lecture_groups.json, _data/lecture_topics.json]
  children:
    - { title: Project, url: /project/, watch: [_data/projects.yml] }
    - { title: Lecture and Consulting, url: /project/#lecture, watch: [_data/lectures.yml, _data/lecture_groups.json, _data/lecture_topics.json] }
- title: Institute & Center
  url: /institutes/
  watch: [institutes, _data/institutes.yml, _data/institute_details.yml]
  children:
    - { title: 인문사회연구소, url: /institutes/humsoc/, watch: [institutes/humsoc.md, _data/institute_details.yml], watch_sections: [humsoc] }
    - { title: 교육공학과 4단계 BK21, url: /institutes/bk21/, watch: [institutes/bk21.md, _data/institute_details.yml], watch_sections: [bk21] }
    - { title: BK21 4단계 AIX 융합교육단, url: /institutes/bk21-aix/, watch: [institutes/bk21-aix.md, _data/institute_details.yml], watch_sections: [bk21-aix] }
    - { title: ECDI, url: /institutes/ecdi/, watch: [institutes/ecdi.md, _data/institute_details.yml], watch_sections: [ecdi] }
    - { title: 교육과정혁신학과, url: /institutes/curriculum/, watch: [institutes/curriculum.md, _data/institute_details.yml], watch_sections: [curriculum] }
    - { title: 교육복지정책중점연구소, url: /institutes/welfare/, watch: [institutes/welfare.md, _data/institute_details.yml], watch_sections: [welfare] }
- title: Awards & Gallery
  url: /highlights/
  watch: [highlights.md, _data/gallery.yml, _data/member_awards.yml, assets/images/gallery]
  children:
    - { title: Awards, url: /highlights/#awards, watch: [_data/member_awards.yml] }
    - { title: Gallery, url: /highlights/#gallery, watch: [_data/gallery.yml] }
- title: Weekly Insight
  url: /weekly-insight/
  watch: [weekly-insight, daily-insight, _insights]
  children:
    - { title: DrS Weekly Insight, url: /weekly-insight/ }
    - { title: Lab Weekly Insight, url: /weekly-insight/lab/ }
    - { title: Deep Research, url: /weekly-insight/deep-research/ }
