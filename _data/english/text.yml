"AI 시대 학습의 세 층. 고전적 정의는 AI를 끈 뒤 사람에게 남는 ①만, 시스템 관점은 사람과 AI가 함께 낸 결과 전체를 잽니다. 이 글이 더하자는 것은 ③입니다. ③의 화살표가 ①에서 출발하는 것은, 모르는 분야에서는 AI의 오류를 알아차릴 수 없다는 뜻입니다. Salomon 등(1991)의 구분을 바탕으로 필자가 제안하는 개념적 틀이며, 실증적으로 검증된 모형은 아닙니다.": "Three proposed layers of learning with AI. An individual account examines what remains without the tool; a system account examines combined performance. The added concern is judgment, grounded in retained understanding. The arrow begins there because recognizing an error requires relevant knowledge. This is the author's conceptual extension of Salomon et al. (1991), not an empirically validated model."
