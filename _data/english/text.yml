"KReC에서 새 설명의 연결이 풍부해지며 기존의 잘못된 지식에 의한 간섭이 줄어드는 과정. 이 그림에서 회색의 ‘옛 지식’은 수정 대상인 잘못된 지식, 파란색의 ‘새 지식’은 이를 교정하는 정보를 뜻합니다. 막대는 개념을 설명하기 위한 것으로 실측값이나 지식 수정의 판정 기준이 아닙니다. Kendeou(2024)의 KReC를 바탕으로 재구성했습니다.": "A conceptual illustration of KReC: stronger connections around a corrective explanation reduce interference from a prior misconception. Gray represents the incorrect prior belief; blue represents corrective information. The bars illustrate the concept, not measurements or assessment thresholds. Adapted from Kendeou's (2024) framework."
