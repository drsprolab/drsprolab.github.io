const split=ps=>{const pa=ps.filter(p=>p.ty=="paper"),po=ps.filter(p=>p.ty=="poster");return (pa.length?`<h3 class="sh" style="color:${AC}">논문 발표 ${pa.length}편</h3>`+sortP(pa).map(item).join(""):"")+(po.length?`<h3 class="sh" style="color:${PC}">포스터 ${po.length}편</h3>`+sortP(po).map(item).join(""):"")};
function hl(id){G.style("opacity",d=>!id||d.id==id||(adj[id]||[]).some(([m])=>m==d.id)?1:.18);L.attr("stroke-opacity",d=>!id?.25:(d.source.id==id||d.target.id==id)?.8:.05)}
function show(id){hl(id);const ps=D.P.filter(p=>p.k.includes(id));const nb=[...(adj[id]||[])].sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]+" "+x[1]).join(" · ");
pn.innerHTML=`<h2>${id} <span style="color:#7ce3d1">${ps.length}편</span></h2>${nb?`<p style="font-size:12px;color:#9fb0d4">주요 연결: ${nb}</p>`:''}`+split(ps)}
sb.onclick=()=>{hl(null);G.style("opacity",d=>d.s?1:.2);const ps=D.P.filter(p=>p.s);pn.innerHTML=`<h2 style="color:#f5c451">★ DrS 발표 ${ps.length}편</h2><p style="font-size:12px;color:#9fb0d4">시작 시간 · 장소 · 세션 (서울대학교)</p>`+(ps.length?split(ps):'<p style="font-size:13px">현재 필터에 해당하는 발표가 없습니다.</p>')};
rs.onclick=()=>{F.org="all";F.ty="all";q.value="";refresh();svg.transition().call(zoom.transform,d3.zoomIdentity)};
q.oninput=()=>{const v=q.value.trim().toLowerCase();if(!v)return home();const m=nodes.find(n=>n.id.toLowerCase().includes(v));if(m)show(m.id)};
const chip=n=>`<span class="chip" data-k="${n.id}">${n.id} · ${n.n}편${n.s?` <span class="st">★ ${n.s}</span>`:''}</span>`;
function legend(){lg.innerHTML=`<h2 style="font-size:16px;margin:0">핵심 키워드 <span style="font-size:12px;color:#9fb0d4;font-weight:500">${scope()}</span></h2>`+gs.map((g,i)=>`<div class="grp"><h3><span style="color:${col[i%6]}">●</span> 군집 ${i+1}</h3>${[...g].sort((a,b)=>b.n-a.n).map(chip).join("")}</div>`).join("")+(D.O.length?`<div class="grp"><h3>네트워크 표시 기준 미만 키워드</h3>${D.O.map(chip).join("")}</div>`:'');
lg.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{show(c.dataset.k);el.scrollIntoView({behavior:"smooth"})})}
const scope=()=>(F.org=="hy"?"한양대학교":"전체 소속")+" · "+({all:"포스터+논문 발표",poster:"포스터",paper:"논문 발표"})[F.ty];
function home(){hl(null);const top=[...D.N].sort((a,b)=>b.n-a.n);const pr=[...D.E].sort((a,b)=>b[2]-a[2]).slice(0,8);const npo=D.P.filter(p=>p.ty=="poster").length;
pn.innerHTML=`<h2>${F.org=="hy"?"한양대학교 발표 분석":"전체 키워드 분석"}</h2><p style="font-size:12px;color:#9fb0d4">${scope()}<br>발표 ${D.P.length}건 (<span style="color:${AC}">논문 발표 ${D.P.length-npo}</span> · <span style="color:${PC}">포스터 ${npo}</span>) · 키워드 ${D.N.length}개 · 연결 ${D.E.length}개<br>노드를 누르면 관련 발표가 표시됩니다. 금빛 노드는 DrS 공동저자 발표 포함.</p>
<h3 style="font-size:13px;margin:14px 0 4px">키워드별 발표 편수 <span style="font-weight:500;font-size:11px"><span style="color:${AC}">■ 논문 발표</span> <span style="color:${PC}">■ 포스터</span></span></h3>`+(top.length?top.map(n=>`<div class="bar" data-k="${n.id}" style="display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0;cursor:pointer"><span style="width:120px">${n.id}${n.s?' <span style=color:#f5c451>★</span>':''}</span><span style="flex:1;background:#142039;border-radius:4px;height:8px;display:flex;overflow:hidden"><span style="width:${n.pa/top[0].n*100}%;background:${AC}"></span><span style="width:${n.po/top[0].n*100}%;background:${PC}"></span></span><span style="width:34px;text-align:right">${n.n}편</span></div>`).join(""):'<p style="font-size:12px">표시할 키워드 연결이 없습니다.</p>')+
(pr.length?`<h3 style="font-size:13px;margin:16px 0 4px">자주 함께 등장한 키워드</h3>`+pr.map(([a,b,v])=>`<div style="font-size:12px;padding:3px 0">${a} ↔ ${b} <span style="color:#7ce3d1">${v}편</span></div>`).join(""):"")+
(F.org=="hy"?`<h3 style="font-size:13px;margin:16px 0 4px">한양대학교 발표 목록</h3>`+split(D.P):"");
pn.querySelectorAll(".bar").forEach(c=>c.onclick=()=>show(c.dataset.k))}
function seg(){document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",F[b.dataset.f]==b.dataset.v))}
function refresh(){build();comm();draw();legend();home();seg()}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{F[b.dataset.f]=b.dataset.v;refresh()});
refresh();
</script></body></html>
