G=NG.selectAll("g").data(nodes).join("g").style("cursor","pointer").call(d3.drag().touchable(()=>false).on("start",(e,d)=>{if(!e.active)sim.alphaTarget(.2).restart();d.fx=d.x;d.fy=d.y}).on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y}).on("end",(e,d)=>{d.fx=null;d.fy=null})).on("click",(e,d)=>show(d.id));
G.filter(d=>d.s).append("circle").attr("class","glow").attr("r",d=>r(d.n)+6);
G.append("circle").attr("r",d=>r(d.n)).attr("fill",d=>col[gi[d.id]%6]).attr("fill-opacity",.88).attr("stroke","#fff").attr("stroke-opacity",.25);
// poster/paper ring
const arc=d3.arc();G.each(function(d){if(F.ty!="all")return;const g=d3.select(this),R=r(d.n);let a0=0;[[d.pa,AC],[d.po,PC],[d.me,MC]].forEach(([v,cl])=>{if(!v)return;const a1=a0+v/d.n*2*Math.PI;g.append("path").attr("d",arc({innerRadius:R+1.5,outerRadius:R+4,startAngle:a0,endAngle:a1})).attr("fill",cl);a0=a1})});
G.append("text").attr("class","cnt").attr("dy",4).text(d=>d.n+"편");
G.append("text").attr("class","lbl").attr("dy",d=>-r(d.n)-8).style("font-size",d=>Math.max(10,Math.min(15,8+d.n/6))+"px").text(d=>d.id);
G.filter(d=>d.s).each(function(d){const g=d3.select(this);for(let i=0;i<5;i++){const a=i*1.256,R=r(d.n)+12;g.append("circle").attr("class","spark").attr("r",2.2).attr("cx",Math.cos(a)*R).attr("cy",Math.sin(a)*R).style("animation-delay",i*.3+"s")}
g.append("text").attr("x",r(d.n)*.75).attr("y",r(d.n)*.95).attr("fill","var(--atlas-gold)").style("font-size","12px").style("font-weight",800).text("★ "+d.s)});
G.select(".lbl").each(function(d){d.labelHalf=this.getComputedTextLength()/2+10});
sim=d3.forceSimulation(nodes).force("link",d3.forceLink(links).id(d=>d.id).distance(d=>120-d.v*2).strength(.25)).force("charge",d3.forceManyBody().strength(-300)).force("center",d3.forceCenter(W/2,H/2)).force("col",d3.forceCollide(d=>r(d.n)+14)).force("x",d3.forceX(W/2).strength(.04)).force("y",d3.forceY(H/2).strength(.05))
.on("tick",()=>{contain();L.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);G.attr("transform",d=>`translate(${d.x},${d.y})`)})}
function contain(){(nodes||[]).forEach(d=>{const padX=Math.min(W/2,Math.max(r(d.n)+20,d.labelHalf||0)),padY=r(d.n)+34;d.x=Math.max(padX,Math.min(W-padX,d.x));d.y=Math.max(padY,Math.min(H-padY,d.y));if(d.fx!=null)d.fx=d.x;if(d.fy!=null)d.fy=d.y})}
new ResizeObserver(()=>{const w=el.clientWidth,h=el.clientHeight;if(!sim||w===W&&h===H)return;W=w;H=h;sim.force("center",d3.forceCenter(W/2,H/2)).force("x",d3.forceX(W/2).strength(.04)).force("y",d3.forceY(H/2).strength(.05));contain();sim.alpha(.5).restart()}).observe(el);
let moving=!matchMedia("(prefers-reduced-motion: reduce)").matches;
d3.timer(t=>{if(!moving||!sim)return;nodes.forEach((n,i)=>{n.vx+=Math.sin(t/1400+i)*.05;n.vy+=Math.cos(t/1700+i*1.3)*.05});if(sim.alpha()<.03)sim.alpha(.03).restart()});
if(!moving)document.body.classList.add("noglow");
const badge=p=>{const t=TY.find(x=>x[0]==p.ty);return `<span class="tb" style="background:${t[2]}">${t[1]}</span>`};
const sch=p=>`<div class="sch">${p.d} · ${p.h} · ${p.room} · ${p.sess}</div>`;
const item=p=>`<div class="it ${p.s?'s':''}">${badge(p)} ${p.s?'<span style="color:var(--atlas-gold)">★ </span>':''}${p.t}<br><b>${p.a}</b><br>${sch(p)}</div>`;
const sortP=ps=>ps.sort((a,b)=>b.s-a.s||(a.ty==b.ty?0:a.ty=="paper"?-1:1));
const split=ps=>TY.map(([k,l,cl])=>{const x=ps.filter(p=>p.ty==k);return x.length?`<h3 class="sh" style="color:${cl}">${l} ${x.length}편</h3>`+sortP(x).map(item).join(""):""}).join("");
function hl(id){G.style("opacity",d=>!id||d.id==id||(adj[id]||[]).some(([m])=>m==d.id)?1:.18);L.attr("stroke-opacity",d=>!id?.25:(d.source.id==id||d.target.id==id)?.8:.05)}
function show(id){pn.classList.add("is-list");pn.scrollTop=0;hl(id);const ps=D.P.filter(p=>p.k.includes(id));const nb=[...(adj[id]||[])].sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]+" "+x[1]).join(" · ");
pn.innerHTML=`<h2>${id} <span style="color:var(--accent)">${ps.length}편</span></h2>${nb?`<p style="font-size:12px;color:var(--muted)">주요 연결: ${nb}</p>`:''}`+split(ps)}
sb.onclick=()=>{pn.classList.add("is-list");pn.scrollTop=0;hl(null);G.style("opacity",d=>d.s?1:.2);const ps=D.P.filter(p=>p.s);pn.innerHTML=`<h2 style="color:var(--atlas-gold)">★ DrS &amp; S'Kids 발표 ${ps.length}편</h2><p style="font-size:12px;color:var(--muted)">날짜 · 시작 시간 · 장소 · 세션 (건국대학교 법학관)</p>`+(ps.length?split(ps):'<p style="font-size:13px">현재 필터에 해당하는 발표가 없습니다.</p>')};
document.getElementById("overview").onclick=()=>{q.value="";home()};
document.getElementById("all").onclick=()=>{hl(null);pn.classList.add("is-list");pn.scrollTop=0;q.value="";pn.innerHTML=`<h2>모든 발표 ${D.P.length}편</h2><p class="summary-copy">${scope()} · 시작 시간 · 장소 · 세션</p>`+split(D.P)};
rs.onclick=()=>{F.org="all";F.ty="all";q.value="";refresh();};
q.oninput=()=>{const v=q.value.trim().toLowerCase();if(!v)return home();const m=nodes.find(n=>n.id.toLowerCase().includes(v));if(m)show(m.id)};
const chip=n=>`<button type="button" class="chip" data-k="${n.id}"><span>${n.id}</span><span class="keyword-count">${n.n}편${n.s?` <span class="st">★ ${n.s}</span>`:''}</span></button>`;
function legend(){lg.innerHTML=`<h2>전체 핵심 키워드 <span style="font-size:12px;color:var(--muted);font-weight:400">${scope()}</span></h2>`+gs.map((g,i)=>`<div class="grp"><h3><span style="color:${col[i%6]}">●</span> 군집 ${i+1}<span class="cluster-count">${g.length}개 키워드 · 발표 편수순</span></h3><div class="keyword-grid">${[...g].sort((a,b)=>b.n-a.n).map(chip).join("")}</div></div>`).join("")+(D.O.length?`<div class="grp"><h3>네트워크 표시 기준 미만 키워드</h3><div class="keyword-grid">${D.O.map(chip).join("")}</div></div>`:'');
lg.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{show(c.dataset.k);el.scrollIntoView({behavior:"smooth"})})}
const scope=()=>(F.org=="hy"?"한양대학교":"전체 소속")+" · "+({all:"전체 유형",poster:"포스터",paper:"논문 발표",media:"미디어전"})[F.ty];
function home(){pn.classList.remove("is-list");pn.scrollTop=0;hl(null);const top=[...D.N].sort((a,b)=>b.n-a.n);const pr=[...D.E].sort((a,b)=>b[2]-a[2]).slice(0,8);const nt=k=>D.P.filter(p=>p.ty==k).length;
pn.innerHTML=`<h2>${F.org=="hy"?"한양대학교 발표 분석":"전체 키워드 분석"}</h2><p class="summary-copy">${scope()}<br>발표 ${D.P.length}건 (${TY.map(([k,l,cl])=>`<span style="color:${cl}">${l} ${nt(k)}</span>`).join(" · ")}) · 키워드 ${D.N.length}개 · 연결 ${D.E.length}개<br>노드를 누르면 관련 발표가 표시됩니다. 금빛 노드는 DrS 공동저자 발표 포함.</p>
<h3 class="summary-heading">키워드별 발표 편수 <span style="font-weight:400;font-size:11px">${TY.map(([k,l,cl])=>`<span style="color:${cl}">■ ${l}</span>`).join(" ")}</span></h3><div class="rank-grid">`+(top.length?top.map(n=>`<button type="button" class="bar" data-k="${n.id}"><span>${n.id}${n.s?' <span style="color:var(--atlas-gold)">★</span>':''}</span><span>${n.n}편</span><span class="bar-track stacked"><span style="width:${n.pa/top[0].n*100}%;background:${AC}"></span><span style="width:${n.po/top[0].n*100}%;background:${PC}"></span><span style="width:${n.me/top[0].n*100}%;background:${MC}"></span></span></button>`).join(""):'<p class="summary-copy">표시할 키워드 연결이 없습니다.</p>')+`</div>`+
(pr.length?`<h3 class="summary-heading">자주 함께 등장한 키워드</h3><div class="pair-grid">`+pr.map(([a,b,v])=>`<div class="pair">${a} ↔ ${b} <span style="color:var(--accent)">${v}편</span></div>`).join("")+`</div>`:"")+
(F.org=="hy"?`<details class="list-toggle"><summary>한양대학교 발표 목록 ${D.P.length}편</summary><div class="filter-results">${split(D.P)}</div></details>`:"");
pn.querySelectorAll(".bar").forEach(c=>c.onclick=()=>show(c.dataset.k))}
function seg(){document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",F[b.dataset.f]==b.dataset.v))}
function refresh(){build();comm();draw();legend();home();seg()}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{F[b.dataset.f]=b.dataset.v;refresh()});
refresh();
function reportHeight(){if(parent!==window)parent.postMessage({type:"conference-atlas-height",height:Math.ceil(document.body.getBoundingClientRect().height)},location.origin)}
new ResizeObserver(reportHeight).observe(document.body);
if(document.fonts)document.fonts.ready.then(reportHeight);
</script></body></html>
