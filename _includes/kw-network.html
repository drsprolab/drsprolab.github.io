<section class="rmap" id="rmap" aria-label="Research Map"
  data-pubs="{{ '/assets/data/publications.json' | relative_url }}"
  data-map="{{ '/assets/data/keyword-map.json' | relative_url }}">
  <header class="rmap-top">
    <div>
      <h2 class="rmap-title">RESEARCH MAP</h2>
      <p class="rmap-desc">논문과 키워드를 잇는 네트워크입니다. 키워드나 점을 누르면 관련 연구가 나옵니다.</p>
    </div>
    <dl class="rmap-stats">
      <div><dt>Papers</dt><dd id="rm-s-papers">–</dd></div>
      <div><dt>Keywords</dt><dd id="rm-s-kws">–</dd></div>
      <div><dt>Links</dt><dd id="rm-s-links">–</dd></div>
      <div><dt>Visible</dt><dd id="rm-s-visible">–</dd></div>
    </dl>
  </header>
  <div class="rmap-body">
    <aside class="rmap-side">
      <div class="rmap-card">
        <h3>탐색</h3>
        <label class="rm-label" for="rm-search">검색</label>
        <input type="search" id="rm-search" class="rm-input" placeholder="키워드나 논문 제목" autocomplete="off">
        <div class="rm-fields" id="rm-fields" role="group" aria-label="학문 분야 필터"></div>
        <label class="rm-check"><input type="checkbox" id="rm-local"> 선택한 항목 주변만 보기</label>
        <button type="button" class="rm-btn" id="rm-reset">초기화</button>
      </div>
      <div class="rmap-card rm-detail" id="rm-detail" aria-live="polite">
        <h3>선택한 항목</h3>
        <p class="rm-hint">키워드나 논문 점을 누르면 여기에 관련 연구가 표시됩니다.</p>
      </div>
    </aside>
    <div class="rmap-graph">
      <div class="rmap-graph-head">
        <strong>PRO AnalytiX Research Map</strong>
        <span>드래그로 고정 · 더블클릭으로 고정 해제 · 스크롤로 확대</span>
      </div>
      <svg id="rm-svg" class="rm-svg" role="group" aria-label="논문과 키워드 네트워크"></svg>
      <div class="rm-zoom"><button type="button" id="rm-zin" aria-label="확대">+</button><button type="button" id="rm-zout" aria-label="축소">−</button><button type="button" id="rm-zfit" aria-label="전체 보기">⤢</button></div>
    </div>
  </div>
  <noscript><p class="rm-hint">연구 지도를 보려면 JavaScript를 켜 주세요.</p></noscript>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="{{ '/assets/js/kw-network.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
