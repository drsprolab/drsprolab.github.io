{%- comment -%}
주요 연구 분야 카드 상단 그림 (추상 일러스트, 원본 제작).
include.icon: learning | organization | hrd | analytics
{%- endcomment -%}
{%- assign k = include.icon -%}
<svg class="area-art" viewBox="0 0 400 150" role="img" aria-label="{{ include.label }}" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-{{ k }}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f38"/><stop offset=".6" stop-color="#123459"/><stop offset="1" stop-color="#1b4a7c"/>
    </linearGradient>
    <radialGradient id="halo-{{ k }}" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7fb2e8" stop-opacity=".45"/><stop offset="1" stop-color="#7fb2e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold-{{ k }}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3dca4"/><stop offset="1" stop-color="#c99a4b"/>
    </linearGradient>
    <pattern id="dots-{{ k }}" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".8" fill="#ffffff" fill-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="400" height="150" fill="url(#bg-{{ k }})"/>
  <rect width="400" height="150" fill="url(#dots-{{ k }})"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
{%- case k -%}
{%- when "learning" %}
    <circle cx="250" cy="75" r="95" fill="url(#halo-{{ k }})" stroke="none"/>
    <g stroke="#9cc3ec" stroke-opacity=".28" stroke-width=".8">
      <circle cx="250" cy="75" r="26"/><circle cx="250" cy="75" r="46"/><circle cx="250" cy="75" r="68"/><circle cx="250" cy="75" r="92" stroke-dasharray="2 5"/>
    </g>
    <ellipse cx="250" cy="75" rx="80" ry="26" transform="rotate(-18 250 75)" stroke="#9cc3ec" stroke-opacity=".55" stroke-width="1"/>
    <ellipse cx="250" cy="75" rx="80" ry="26" transform="rotate(32 250 75)" stroke="#9cc3ec" stroke-opacity=".35" stroke-width="1"/>
    <path d="M250 75 L174 98 M250 75 L316 40 M250 75 L232 18 M250 75 L300 122" stroke="#ffffff" stroke-opacity=".22" stroke-width=".8"/>
    <g fill="#ffffff" stroke="none"><circle cx="174" cy="98" r="3"/><circle cx="316" cy="40" r="3.2"/><circle cx="232" cy="18" r="2.4"/><circle cx="300" cy="122" r="2.6"/><circle cx="330" cy="88" r="1.8" fill-opacity=".7"/><circle cx="186" cy="52" r="1.8" fill-opacity=".7"/></g>
    <circle cx="250" cy="75" r="9" fill="url(#gold-{{ k }})" stroke="none"/>
    <circle cx="250" cy="75" r="15" stroke="url(#gold-{{ k }})" stroke-opacity=".6" stroke-width="1"/>
    <g stroke="#ffffff" stroke-opacity=".5" stroke-width="1"><path d="M40 112 H120"/><path d="M40 120 H96" stroke-opacity=".25"/></g>
    <text x="40" y="100" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9.5" letter-spacing="1.6" fill="#ffffff" fill-opacity=".55">HUMAN × AI</text>
{%- when "organization" %}
    <circle cx="250" cy="70" r="90" fill="url(#halo-{{ k }})" stroke="none"/>
    <g stroke="#9cc3ec" stroke-width="1">
      <path d="M250 104 L316 122 L250 140 L184 122 Z" fill="#9cc3ec" fill-opacity=".10" stroke-opacity=".55"/>
      <path d="M250 70 L310 86 L250 102 L190 86 Z" fill="#9cc3ec" fill-opacity=".14" stroke-opacity=".7"/>
      <path d="M250 38 L300 51 L250 64 L200 51 Z" fill="#9cc3ec" fill-opacity=".20" stroke-opacity=".9"/>
    </g>
    <path d="M250 122 V12" stroke="url(#gold-{{ k }})" stroke-width="1.4"/>
    <path d="M244 18 L250 10 L256 18" stroke="#e7c47f" stroke-width="1.4"/>
    <g stroke="#ffffff" stroke-opacity=".3" stroke-width=".8"><path d="M214 122 L232 86 L250 51 M286 122 L268 86 L250 51 M200 122 L210 86"/></g>
    <g fill="#ffffff" stroke="none">
      <circle cx="214" cy="122" r="2.4"/><circle cx="250" cy="122" r="2.4"/><circle cx="286" cy="122" r="2.4"/><circle cx="200" cy="122" r="1.8" fill-opacity=".7"/><circle cx="300" cy="122" r="1.8" fill-opacity=".7"/>
      <circle cx="232" cy="86" r="2.8"/><circle cx="268" cy="86" r="2.8"/><circle cx="210" cy="86" r="2" fill-opacity=".7"/>
      <circle cx="250" cy="51" r="4.2" fill="url(#gold-{{ k }})"/>
    </g>
    <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="8.5" letter-spacing="1.4" fill="#ffffff" fill-opacity=".45">
      <text x="326" y="125">INDIVIDUAL</text><text x="320" y="89">GROUP</text><text x="310" y="54">ORGANIZATION</text>
    </g>
{%- when "hrd" %}
    <circle cx="282" cy="75" r="85" fill="url(#halo-{{ k }})" stroke="none"/>
    <g stroke="#9cc3ec" stroke-width="1">
      <path d="M30 22 C130 22 170 72 268 75" stroke-opacity=".35"/>
      <path d="M30 48 C130 48 180 74 268 75" stroke-opacity=".5"/>
      <path d="M30 75 C120 75 200 75 268 75" stroke-opacity=".7"/>
      <path d="M30 102 C130 102 180 76 268 75" stroke-opacity=".5"/>
      <path d="M30 128 C130 128 170 78 268 75" stroke-opacity=".35"/>
    </g>
    <g fill="#ffffff" stroke="none"><circle cx="92" cy="25" r="2"/><circle cx="128" cy="53" r="2.4"/><circle cx="160" cy="75" r="2.6"/><circle cx="118" cy="99" r="2.2"/><circle cx="150" cy="117" r="2"/><circle cx="200" cy="66" r="1.8" fill-opacity=".7"/><circle cx="210" cy="86" r="1.8" fill-opacity=".7"/></g>
    <path d="M282 55 L299 65 L299 85 L282 95 L265 85 L265 65 Z" stroke="url(#gold-{{ k }})" stroke-width="1.6" fill="#0b1f38" fill-opacity=".6"/>
    <path d="M282 64 L291 69 L291 81 L282 86 L273 81 L273 69 Z" fill="url(#gold-{{ k }})" stroke="none" fill-opacity=".9"/>
    <path d="M300 75 C330 75 340 40 372 34" stroke="#e7c47f" stroke-width="1.2" stroke-dasharray="3 4"/>
    <path d="M300 75 C330 75 342 104 372 112" stroke="#ffffff" stroke-opacity=".4" stroke-width="1" stroke-dasharray="3 4"/>
    <circle cx="372" cy="34" r="3" fill="#e7c47f" stroke="none"/><circle cx="372" cy="112" r="2.6" fill="#ffffff" fill-opacity=".7" stroke="none"/>
    <text x="30" y="142" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9.5" letter-spacing="1.6" fill="#ffffff" fill-opacity=".55">TALENT → AI → GROWTH</text>
{%- when "analytics" %}
    <circle cx="110" cy="80" r="80" fill="url(#halo-{{ k }})" stroke="none"/>
    <g stroke="#ffffff" stroke-opacity=".12" stroke-width=".6"><path d="M30 30 H190 M30 60 H190 M30 90 H190 M30 120 H190 M70 22 V128 M110 22 V128 M150 22 V128"/></g>
    <path d="M30 124 C60 124 70 52 98 52 C120 52 122 98 140 98 C156 98 162 64 178 64 C186 64 190 110 196 124" stroke="#9cc3ec" stroke-width="1.4" stroke-opacity=".85"/>
    <path d="M30 124 C64 124 84 40 110 40 C136 40 156 124 190 124" stroke="url(#gold-{{ k }})" stroke-width="1.2" stroke-dasharray="3 3"/>
    <g fill="#ffffff" stroke="none" fill-opacity=".75"><circle cx="48" cy="112" r="1.6"/><circle cx="66" cy="96" r="1.6"/><circle cx="82" cy="70" r="1.6"/><circle cx="94" cy="58" r="1.6"/><circle cx="118" cy="66" r="1.6"/><circle cx="132" cy="90" r="1.6"/><circle cx="150" cy="86" r="1.6"/><circle cx="168" cy="72" r="1.6"/><circle cx="182" cy="96" r="1.6"/></g>

    <g stroke="#9cc3ec" stroke-width="1" stroke-opacity=".8"><path d="M296 70 L334 34 M296 75 L334 75 M296 80 L334 116"/></g>
    <g stroke="#9cc3ec" stroke-width="1" fill="#0b1f38" fill-opacity=".55"><rect x="336" y="24" width="34" height="20" rx="2"/><rect x="336" y="65" width="34" height="20" rx="2"/><rect x="336" y="106" width="34" height="20" rx="2"/></g>
    <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#ffffff" fill-opacity=".75" text-anchor="middle"><text x="353" y="37">y1</text><text x="353" y="78">y2</text><text x="353" y="119">y3</text></g>
    <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="8" fill="#ffffff" fill-opacity=".45"><text x="306" y="46">.82</text><text x="310" y="71">.76</text><text x="306" y="110">.71</text></g>
{%- endcase %}
  </g>
</svg>
