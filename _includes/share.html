{%- comment -%} 제목 옆 공유 버튼. 휴대폰은 기기 공유 창, 컴퓨터는 링크 복사·SNS 메뉴. 쓰는 곳: insight 레이아웃, share: true인 page {%- endcomment -%}
{%- assign share_url = page.url | absolute_url -%}
<div class="share" data-url="{{ share_url }}" data-title="{{ page.title | escape }}">
  <button type="button" class="share-btn" aria-haspopup="true" aria-expanded="false" aria-controls="share-menu">공유</button>
  <div class="share-menu" id="share-menu" role="menu" hidden>
    <button type="button" role="menuitem" data-share="copy">링크 복사</button>
    <a role="menuitem" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u={{ share_url | url_encode }}">Facebook</a>
    <a role="menuitem" target="_blank" rel="noopener" href="https://www.linkedin.com/sharing/share-offsite/?url={{ share_url | url_encode }}">LinkedIn</a>
    <a role="menuitem" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?url={{ share_url | url_encode }}&amp;text={{ page.title | url_encode }}">X</a>
    <a role="menuitem" href="mailto:?subject={{ page.title | url_encode }}&amp;body={{ share_url | url_encode }}">이메일</a>
    <span class="share-done" role="status" aria-live="polite"></span>
  </div>
</div>
<script>
// 공유 버튼: 휴대폰은 기기 공유 창, 컴퓨터는 링크 복사·SNS 메뉴
(function () {
  var box = document.querySelector('.share'); if (!box) return;
  var btn = box.querySelector('.share-btn'), menu = box.querySelector('.share-menu'), done = box.querySelector('.share-done');
  var url = box.dataset.url, title = box.dataset.title;
  var touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  function toggle(open) { menu.hidden = !open; btn.setAttribute('aria-expanded', String(open)); if (!open) done.textContent = '';
    if (open) { menu.classList.remove('to-left'); if (menu.getBoundingClientRect().right > document.documentElement.clientWidth - 8) menu.classList.add('to-left'); } }
  btn.addEventListener('click', function () {
    if (touch && navigator.share) { navigator.share({ title: title, url: url }).catch(function () {}); return; }
    toggle(menu.hidden);
  });
  box.querySelector('[data-share="copy"]').addEventListener('click', function () {
    function ok() { done.textContent = '링크를 복사했습니다'; setTimeout(function () { toggle(false); }, 1200); }
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(ok, function () { window.prompt('링크를 복사하세요', url); });
    else window.prompt('링크를 복사하세요', url);
  });
  menu.addEventListener('click', function (e) { if (e.target.tagName === 'A') toggle(false); });
  document.addEventListener('click', function (e) { if (!box.contains(e.target)) toggle(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { toggle(false); btn.focus(); } });
})();
</script>
